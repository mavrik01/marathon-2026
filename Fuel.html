<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maverik - Fueling Calculator</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f2ec;
    --surface: #edeae2;
    --surface2: #e4e0d7;
    --border: #d4cfc4;
    --text: #1a1917;
    --text-muted: #7a766d;
    --accent: #c84b2f;
    --accent2: #e8a020;
    --easy: #4a8fb5;
    --steady: #3a7d44;
    --threshold: #c84b2f;
    --mp: #7b5ea7;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  header { border-bottom: 1.5px solid var(--border); padding: 1.5rem 2rem; display: flex; align-items: baseline; gap: 1.5rem; }
  header .site-name { font-family: 'DM Mono', monospace; font-size: 0.7rem; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted); }
  header h1 { font-family: 'DM Mono', monospace; font-size: 0.85rem; font-weight: 400; letter-spacing: 0.06em; }
  header .race-date { margin-left: auto; font-family: 'DM Mono', monospace; font-size: 0.7rem; color: var(--text-muted); letter-spacing: 0.08em; }
  .container { max-width: 860px; margin: 0 auto; padding: 2.5rem 2rem; }
  .section-label { font-family: 'DM Mono', monospace; font-size: 0.65rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.75rem; }
  .run-selector { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5rem; margin-bottom: 2.5rem; }
  .run-btn { background: var(--surface); border: 1.5px solid var(--border); border-radius: 4px; padding: 0.9rem 0.5rem; cursor: pointer; text-align: center; transition: all 0.15s ease; }
  .run-btn:hover { border-color: var(--text-muted); }
  .run-btn.active { border-color: var(--text); background: var(--text); color: var(--bg); }
  .run-btn .run-name { font-family: 'DM Mono', monospace; font-size: 0.75rem; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; display: block; }
  .run-btn .run-pace { font-family: 'DM Mono', monospace; font-size: 0.65rem; color: var(--text-muted); display: block; margin-top: 0.3rem; }
  .run-btn.active .run-pace { color: rgba(245,242,236,0.6); }
  .run-btn .run-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; margin-bottom: 0.4rem; }
  .dot-easy { background: var(--easy); }
  .dot-steady { background: var(--steady); }
  .dot-threshold { background: var(--threshold); }
  .dot-mp { background: var(--mp); }
  .active-easy { border-color: var(--easy) !important; background: var(--easy) !important; }
  .active-steady { border-color: var(--steady) !important; background: var(--steady) !important; }
  .active-threshold { border-color: var(--threshold) !important; background: var(--threshold) !important; }
  .active-mp { border-color: var(--mp) !important; background: var(--mp) !important; }
  .inputs-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; margin-bottom: 2.5rem; }
  .input-group { background: var(--surface); border: 1.5px solid var(--border); border-radius: 4px; padding: 1rem 1.1rem; }
  .input-group label { font-family: 'DM Mono', monospace; font-size: 0.62rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted); display: block; margin-bottom: 0.4rem; }
  .input-group input, .input-group select { width: 100%; background: transparent; border: none; font-family: 'DM Mono', monospace; font-size: 1.2rem; font-weight: 500; color: var(--text); outline: none; -moz-appearance: textfield; }
  .input-group input::-webkit-outer-spin-button, .input-group input::-webkit-inner-spin-button { -webkit-appearance: none; }
  .input-group select { font-size: 0.85rem; cursor: pointer; -webkit-appearance: none; }
  .unit { font-family: 'DM Mono', monospace; font-size: 0.7rem; color: var(--text-muted); }
  .results-card { background: var(--text); color: var(--bg); border-radius: 6px; padding: 2rem; margin-bottom: 2rem; position: relative; overflow: hidden; }
  .results-card::before { content: '\26A1'; position: absolute; right: 1.5rem; top: 1.5rem; font-size: 1.2rem; opacity: 0.3; }
  .results-heading { font-family: 'DM Mono', monospace; font-size: 0.65rem; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(245,242,236,0.5); margin-bottom: 1.5rem; }
  .results-main { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem; }
  .result-item .result-value { font-family: 'DM Mono', monospace; font-size: 2rem; font-weight: 500; line-height: 1; }
  .result-item .result-unit { font-family: 'DM Mono', monospace; font-size: 0.75rem; color: rgba(245,242,236,0.55); margin-left: 0.25rem; }
  .result-item .result-label { font-family: 'DM Mono', monospace; font-size: 0.62rem; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(245,242,236,0.45); margin-top: 0.35rem; }
  .divider { border: none; border-top: 1px solid rgba(245,242,236,0.1); margin: 1.5rem 0; }
  .timing-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 0.75rem; }
  .timing-item { background: rgba(245,242,236,0.06); border-radius: 4px; padding: 0.75rem; }
  .timing-item .t-time { font-family: 'DM Mono', monospace; font-size: 0.85rem; font-weight: 500; }
  .timing-item .t-what { font-family: 'DM Mono', monospace; font-size: 0.6rem; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(245,242,236,0.45); margin-top: 0.25rem; }
  .timing-item .t-detail { font-size: 0.72rem; color: rgba(245,242,236,0.6); margin-top: 0.2rem; }
  .sugar-card { background: var(--surface); border: 1.5px solid var(--border); border-radius: 4px; overflow: hidden; margin-bottom: 2rem; }
  .sugar-card-header { padding: 0.9rem 1.2rem; border-bottom: 1.5px solid var(--border); background: var(--surface2); display: flex; align-items: baseline; gap: 0.75rem; }
  .sugar-card-header .sc-title { font-family: 'DM Mono', monospace; font-size: 0.65rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted); }
  .sugar-card-header .sc-total { font-family: 'DM Mono', monospace; font-size: 0.8rem; font-weight: 500; color: var(--text); }
  .sugar-rows { display: grid; grid-template-columns: 1fr 1fr; }
  .sugar-row { padding: 1.2rem 1.4rem; border-right: 1px solid var(--border); }
  .sugar-row:nth-child(2) { border-right: none; }
  .sugar-row .sr-label { font-family: 'DM Mono', monospace; font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.35rem; }
  .sugar-row .sr-value { font-family: 'DM Mono', monospace; font-size: 1.6rem; font-weight: 500; line-height: 1; }
  .sugar-row .sr-unit { font-family: 'DM Mono', monospace; font-size: 0.75rem; color: var(--text-muted); margin-left: 0.2rem; }
  .sugar-row .sr-note { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.3rem; }
  .sugar-instructions { border-top: 1.5px solid var(--border); padding: 1rem 1.4rem; font-size: 0.82rem; line-height: 1.6; color: var(--text-muted); }
  .sugar-instructions strong { color: var(--text); }
  .serving-grid { border-top: 1px solid var(--border); display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
  .serving-cell { padding: 0.9rem 1rem; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); }
  .serving-cell .sv-time { font-family: 'DM Mono', monospace; font-size: 0.72rem; font-weight: 500; }
  .serving-cell .sv-amount { font-family: 'DM Mono', monospace; font-size: 0.62rem; color: var(--text-muted); margin-top: 0.2rem; }
  .notes-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .note-card { background: var(--surface); border: 1.5px solid var(--border); border-radius: 4px; padding: 1.2rem; }
  .note-card h3 { font-family: 'DM Mono', monospace; font-size: 0.65rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.7rem; }
  .note-card li { font-size: 0.82rem; line-height: 1.6; color: var(--text); margin-bottom: 0.25rem; }
  .note-card ul { padding-left: 1rem; }
  .no-fuel { text-align: center; padding: 3rem 2rem; color: var(--text-muted); background: var(--surface); border: 1.5px dashed var(--border); border-radius: 6px; margin-bottom: 2rem; }
  .no-fuel .nf-icon { font-size: 2rem; margin-bottom: 0.75rem; }
  .no-fuel p { font-family: 'DM Mono', monospace; font-size: 0.75rem; letter-spacing: 0.06em; }
  footer { border-top: 1.5px solid var(--border); padding: 1.2rem 2rem; font-family: 'DM Mono', monospace; font-size: 0.65rem; color: var(--text-muted); letter-spacing: 0.06em; text-align: center; }
  @media (max-width: 600px) {
    .run-selector { grid-template-columns: 1fr 1fr; }
    .inputs-grid { grid-template-columns: 1fr 1fr; }
    .results-main { grid-template-columns: 1fr 1fr; }
    .notes-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <span class="site-name">Maverik</span>
  <h1>Fueling Calculator</h1>
  <span class="race-date">Sept 20 &middot; Race Day</span>
</header>

<div class="container">

  <div class="section-label">Run Type</div>
  <div class="run-selector">
    <button class="run-btn" data-type="easy" onclick="selectRun(this)">
      <span class="run-dot dot-easy"></span>
      <span class="run-name">Easy</span>
      <span class="run-pace">7:45-8:30 /mi</span>
    </button>
    <button class="run-btn" data-type="steady" onclick="selectRun(this)">
      <span class="run-dot dot-steady"></span>
      <span class="run-name">Steady</span>
      <span class="run-pace">7:15-7:30 /mi</span>
    </button>
    <button class="run-btn" data-type="threshold" onclick="selectRun(this)">
      <span class="run-dot dot-threshold"></span>
      <span class="run-name">Threshold</span>
      <span class="run-pace">6:10-6:20 /mi</span>
    </button>
    <button class="run-btn" data-type="mp" onclick="selectRun(this)">
      <span class="run-dot dot-mp"></span>
      <span class="run-name">MP</span>
      <span class="run-pace">6:50-6:55 /mi</span>
    </button>
  </div>

  <div class="section-label">Run Details</div>
  <div class="inputs-grid">
    <div class="input-group">
      <label>Distance</label>
      <div style="display:flex;align-items:baseline;gap:0.4rem">
        <input type="number" id="distance" min="1" max="50" step="0.5" value="10" oninput="calculate()">
        <span class="unit">mi</span>
      </div>
    </div>
    <div class="input-group">
      <label>Body Weight</label>
      <div style="display:flex;align-items:baseline;gap:0.4rem">
        <input type="number" id="weight" min="80" max="300" value="155" oninput="calculate()">
        <span class="unit">lb</span>
      </div>
    </div>
    <div class="input-group">
      <label>Conditions</label>
      <select id="conditions" onchange="calculate()">
        <option value="cool">Cool / Indoor</option>
        <option value="mild" selected>Mild (55-65F)</option>
        <option value="warm">Warm (65-75F)</option>
        <option value="hot">Hot (75F+)</option>
      </select>
    </div>
  </div>

  <div id="results-area"></div>

</div>

<footer>
  After every run: Core + Pushups &middot; Fueling guidelines based on ISSN / sports nutrition consensus
</footer>

<script>
var RUN_TYPES = {
  easy:      { label: 'Easy',      pace: '8:08', mets: 8.5,  carbRate: 45, fuelThreshold: 75 },
  steady:    { label: 'Steady',    pace: '7:22', mets: 10.0, carbRate: 55, fuelThreshold: 60 },
  threshold: { label: 'Threshold', pace: '6:15', mets: 12.5, carbRate: 65, fuelThreshold: 45 },
  mp:        { label: 'MP',        pace: '6:52', mets: 11.5, carbRate: 60, fuelThreshold: 50 }
};

var selectedType = null;

function selectRun(btn) {
  var btns = document.querySelectorAll('.run-btn');
  for (var i = 0; i < btns.length; i++) {
    btns[i].classList.remove('active','active-easy','active-steady','active-threshold','active-mp');
  }
  selectedType = btn.dataset.type;
  btn.classList.add('active', 'active-' + selectedType);
  calculate();
}

function paceToMinutes(pace) {
  var parts = pace.split(':');
  return parseInt(parts[0]) + parseInt(parts[1]) / 60;
}

function formatTime(totalMin) {
  var h = Math.floor(totalMin / 60);
  var m = Math.round(totalMin % 60);
  if (h === 0) return m + 'm';
  if (m === 0) return h + 'h';
  return h + 'h ' + m + 'm';
}

function formatClock(totalMin) {
  var h = Math.floor(totalMin / 60);
  var m = Math.round(totalMin % 60);
  if (h === 0) return m + ':00';
  return h + ':' + (m < 10 ? '0' : '') + m;
}

function stat(val, unit, label) {
  return '<div class="result-item"><div><span class="result-value">' + val + '</span>' +
    (unit ? '<span class="result-unit">' + unit + '</span>' : '') +
    '</div><div class="result-label">' + label + '</div></div>';
}

function calculate() {
  var area = document.getElementById('results-area');
  if (!selectedType) {
    area.innerHTML = '<div class="no-fuel"><div class="nf-icon">&#9889;</div><p>Select a run type above to calculate fueling</p></div>';
    return;
  }

  var dist        = parseFloat(document.getElementById('distance').value) || 0;
  var weight      = parseFloat(document.getElementById('weight').value) || 155;
  var cond        = document.getElementById('conditions').value;
  var run         = RUN_TYPES[selectedType];
  var durationMin = dist * paceToMinutes(run.pace);
  var weightKg    = weight * 0.453592;
  var calsBurned  = Math.round(run.mets * weightKg * (durationMin / 60));
  var carbsNeeded = Math.round(run.carbRate * (durationMin / 60));
  var hydMults    = { cool: 12, mild: 16, warm: 20, hot: 24 };
  var hydrationOz = Math.round(hydMults[cond] * (durationMin / 60));
  var sodiumMg    = Math.round(500 + (weightKg * 0.5) * (durationMin / 60));
  var needsFueling = durationMin >= run.fuelThreshold;

  // Timings
  var timings = [];
  if (needsFueling) {
    timings.push({ time: 'Pre-run', what: 'Carbs', detail: '30-60g, 30-45 min before' });
    if (durationMin > 45) {
      var t = 45;
      var interval = (selectedType === 'easy') ? 35 : 30;
      while (t < durationMin - 10) {
        timings.push({ time: formatClock(t), what: 'Sip', detail: 'sugar mix + water' });
        t += interval;
      }
    }
    timings.push({ time: 'Post-run', what: 'Recovery', detail: '3:1 carb:protein in 30m' });
  }

  // Summary stats
  var summaryHtml = '';
  summaryHtml += stat(formatTime(durationMin), '', 'Est. Duration');
  summaryHtml += stat(calsBurned, 'kcal', 'Calories Burned');
  summaryHtml += stat(hydrationOz, 'oz', 'Hydration Target');
  summaryHtml += stat(carbsNeeded, 'g', 'Carbs to Replace');
  summaryHtml += stat(sodiumMg, 'mg', 'Sodium Target');
  summaryHtml += stat(needsFueling ? carbsNeeded : '--', needsFueling ? 'g' : '', needsFueling ? 'Carbs to Carry' : 'No Fueling Needed');

  // Timeline
  var timelineHtml = '<hr class="divider">';
  if (timings.length > 0) {
    timelineHtml += '<div style="font-family:\'DM Mono\',monospace;font-size:0.62rem;letter-spacing:0.12em;text-transform:uppercase;color:rgba(245,242,236,0.4);margin-bottom:0.75rem;">Fueling Timeline</div>';
    timelineHtml += '<div class="timing-grid">';
    for (var i = 0; i < timings.length; i++) {
      timelineHtml += '<div class="timing-item"><div class="t-time">' + timings[i].time + '</div><div class="t-what">' + timings[i].what + '</div><div class="t-detail">' + timings[i].detail + '</div></div>';
    }
    timelineHtml += '</div>';
  } else {
    timelineHtml += '<div style="font-family:\'DM Mono\',monospace;font-size:0.72rem;color:rgba(245,242,236,0.45);">Run is under ' + run.fuelThreshold + ' min - water only. Focus on post-run recovery nutrition.</div>';
  }

  // Sugar card
  var sugarCardHtml = '';
  if (needsFueling) {
    var tsp     = Math.round(carbsNeeded / 4);
    var tbsp    = (tsp / 3).toFixed(1);
    var waterMl = Math.round(hydrationOz * 29.5735);
    var concPct = (carbsNeeded / (waterMl / 100)).toFixed(1);
    var sipTimings = [];
    for (var j = 0; j < timings.length; j++) {
      if (timings[j].what === 'Sip') sipTimings.push(timings[j]);
    }
    var numSips   = sipTimings.length;
    var tspPerSip = numSips > 0 ? Math.round((carbsNeeded / numSips) / 4) : tsp;
    var ozPerSip  = numSips > 0 ? Math.round(hydrationOz / numSips) : hydrationOz;
    var servingItems = '';
    for (var k = 0; k < sipTimings.length; k++) {
      servingItems += '<div class="serving-cell"><div class="sv-time">' + sipTimings[k].time + '</div><div class="sv-amount">' + tspPerSip + ' tsp / ' + ozPerSip + ' oz</div></div>';
    }
    sugarCardHtml  = '<div class="section-label">Homemade Fuel - ' + carbsNeeded + 'g carbs from table sugar</div>';
    sugarCardHtml += '<div class="sugar-card">';
    sugarCardHtml += '<div class="sugar-card-header"><span class="sc-title">Full-run batch</span><span class="sc-total">' + carbsNeeded + 'g carbs / ~' + concPct + '% solution</span></div>';
    sugarCardHtml += '<div class="sugar-rows">';
    sugarCardHtml += '<div class="sugar-row"><div class="sr-label">Table Sugar</div><div><span class="sr-value">' + tsp + '</span><span class="sr-unit">tsp</span></div><div class="sr-note">' + tbsp + ' tbsp / ' + carbsNeeded + 'g carbs</div></div>';
    sugarCardHtml += '<div class="sugar-row"><div class="sr-label">Water</div><div><span class="sr-value">' + hydrationOz + '</span><span class="sr-unit">oz</span></div><div class="sr-note">' + waterMl + ' ml total</div></div>';
    sugarCardHtml += '</div>';
    sugarCardHtml += '<div class="sugar-instructions"><strong>Mix:</strong> dissolve sugar in a small amount of warm water first, then top up to ' + hydrationOz + ' oz total. Add a <strong>pinch of salt</strong> (1/8 tsp) per ' + Math.round(hydrationOz / 2) + ' oz for sodium. Carry in a soft flask. Sip steadily.</div>';
    if (servingItems) {
      sugarCardHtml += '<div class="serving-grid">' + servingItems + '</div>';
    }
    sugarCardHtml += '</div>';
  }

  // Notes
  var sipsEvery15 = Math.round(hydrationOz / Math.max(1, Math.floor(durationMin / 15)));
  var postRunOz   = Math.round(hydrationOz * 1.5);
  var hydNotes    = '<li>Sip <strong>' + sipsEvery15 + ' oz</strong> every 15 min during run</li>';
  hydNotes       += '<li>Drink <strong>' + postRunOz + ' oz</strong> post-run to rehydrate</li>';
  if (cond !== 'cool') hydNotes += '<li>Add electrolytes if using plain water</li>';
  if (cond === 'hot')  hydNotes += '<li>Pre-hydrate 16-20 oz, 2 hrs before</li>';

  var recNotes  = '<li><strong>0-30 min:</strong> 20-30g protein + carbs</li>';
  recNotes     += '<li><strong>Carbs:</strong> ~' + Math.round(carbsNeeded * 0.8) + 'g within 2 hrs</li>';
  recNotes     += '<li><strong>Protein:</strong> 0.3g per kg body weight</li>';
  recNotes     += (durationMin > 90) ? '<li>Consider chocolate milk or recovery shake</li>' : '<li>Whole food meal within 2 hrs is fine</li>';

  var notesHtml  = '<div class="notes-grid">';
  notesHtml     += '<div class="note-card"><h3>Hydration Strategy</h3><ul>' + hydNotes + '</ul></div>';
  notesHtml     += '<div class="note-card"><h3>Recovery Window</h3><ul>' + recNotes + '</ul></div>';
  notesHtml     += '</div>';

  area.innerHTML =
    '<div class="results-card">' +
      '<div class="results-heading">Run Summary / ' + run.label + ' / ' + dist + ' mi</div>' +
      '<div class="results-main">' + summaryHtml + '</div>' +
      timelineHtml +
    '</div>' +
    sugarCardHtml +
    notesHtml;
}

document.addEventListener('DOMContentLoaded', function() { calculate(); });
</script>
</body>
</html>
