<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maverik — Marathon 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f0e;
    --surface: #141714;
    --surface2: #1a1d1a;
    --border: #2a2e2a;
    --accent: #b8f55a;
    --accent2: #5af5b8;
    --accent3: #f5a85a;
    --accent4: #5ab8f5;
    --text: #e8ede8;
    --text-muted: #6b756b;
    --text-dim: #3d443d;
    --run: #5af5b8;
    --lift: #b8f55a;
    --cross: #5ab8f5;
    --rest: #3d443d;
    --done: #2a332a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* HEADER */
  header {
    padding: 32px 40px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
    flex-wrap: wrap;
  }

  .title-block h1 {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: clamp(36px, 6vw, 72px);
    line-height: 0.9;
    letter-spacing: -1px;
    color: var(--accent);
    text-transform: uppercase;
  }

  .title-block p {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 400;
    font-size: 14px;
    letter-spacing: 4px;
    color: var(--text-muted);
    text-transform: uppercase;
    margin-top: 8px;
  }

  .race-countdown {
    text-align: right;
  }

  .race-countdown .days {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: clamp(48px, 8vw, 96px);
    line-height: 1;
    color: var(--text);
  }

  .race-countdown .label {
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--text-muted);
    text-transform: uppercase;
  }

  /* LEGEND */
  .legend {
    display: flex;
    gap: 20px;
    padding: 16px 40px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
    align-items: center;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .legend-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }

  /* PACES */
  .paces-bar {
    display: flex;
    gap: 0;
    padding: 12px 40px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
    gap: 24px;
  }

  .pace-tag {
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 1px;
  }

  .pace-tag span {
    color: var(--text);
    font-weight: 500;
  }

  /* PHASE NAVIGATION */
  .phase-nav {
    display: flex;
    gap: 0;
    padding: 0 40px;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }

  .phase-btn {
    background: none;
    border: none;
    border-bottom: 3px solid transparent;
    color: var(--text-muted);
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    padding: 16px 20px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
  }

  .phase-btn:hover { color: var(--text); }
  .phase-btn.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  /* MAIN CONTENT */
  .main {
    padding: 32px 40px;
    max-width: 1400px;
  }

  /* PHASE HEADER */
  .phase-header {
    display: flex;
    align-items: baseline;
    gap: 16px;
    margin-bottom: 24px;
  }

  .phase-header h2 {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 32px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--accent);
  }

  .phase-header p {
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* WEEK */
  .week {
    margin-bottom: 20px;
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
    transition: all 0.3s;
  }

  .week.down-week { border-color: #2a3d2a; }
  .week.race-week { border-color: var(--accent); }

  .week-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    background: var(--surface);
    cursor: pointer;
    gap: 12px;
    flex-wrap: wrap;
  }

  .week-header:hover { background: var(--surface2); }

  .week-label {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .week-num {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 20px;
    color: var(--accent);
    min-width: 60px;
  }

  .week-dates {
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 1px;
  }

  .week-tag {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 2px;
    background: #1f2e1f;
    color: var(--accent2);
  }

  .week-tag.down { background: #1f2a1f; color: #5af5b8; }
  .week-tag.race { background: var(--accent); color: var(--bg); }
  .week-tag.phase0 { background: #2a2a1f; color: var(--accent3); }

  .week-mileage {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 18px;
    color: var(--text-muted);
  }

  .week-progress {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .progress-bar {
    width: 80px;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.3s;
  }

  .progress-text {
    font-size: 11px;
    color: var(--text-muted);
    min-width: 32px;
    text-align: right;
  }

  .chevron {
    color: var(--text-dim);
    font-size: 14px;
    transition: transform 0.3s;
  }

  .week.open .chevron { transform: rotate(180deg); }

  /* DAYS GRID */
  .days-grid {
    display: none;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 1px;
    background: var(--border);
  }

  .week.open .days-grid { display: grid; }

  .day-card {
    background: var(--bg);
    padding: 16px;
    min-height: 120px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .day-card.completed { background: var(--done); }

  .day-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .day-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .day-date {
    font-size: 10px;
    color: var(--text-dim);
  }

  .day-type-badge {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
  }

  .badge {
    font-size: 9px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 2px 6px;
    border-radius: 2px;
    font-weight: 600;
  }

  .badge.run { background: #0d2d20; color: var(--run); }
  .badge.lift { background: #1a2a05; color: var(--lift); }
  .badge.cross { background: #0a1e30; color: var(--cross); }
  .badge.rest { background: #1a1a1a; color: var(--text-dim); }
  .badge.race { background: var(--accent); color: var(--bg); }

  .workout-lines {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .workout-line {
    font-size: 12px;
    color: var(--text);
    line-height: 1.4;
  }

  .workout-line.muted { color: var(--text-muted); font-size: 11px; }
  .workout-line.highlight { color: var(--accent); font-weight: 500; }
  .workout-line.run-color { color: var(--run); }
  .workout-line.lift-color { color: var(--lift); }
  .workout-line.cross-color { color: var(--cross); }

  .check-btn {
    align-self: flex-end;
    background: none;
    border: 1px solid var(--border);
    border-radius: 3px;
    width: 28px;
    height: 28px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    font-size: 14px;
    transition: all 0.2s;
    margin-top: 4px;
    flex-shrink: 0;
  }

  .check-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .day-card.completed .check-btn {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--bg);
  }

  /* LIFTING PANEL */
  .lifting-panel {
    position: fixed;
    right: -420px;
    top: 0;
    height: 100vh;
    width: 420px;
    background: var(--surface);
    border-left: 1px solid var(--border);
    z-index: 100;
    overflow-y: auto;
    transition: right 0.3s cubic-bezier(0.4,0,0.2,1);
    padding: 24px;
  }

  .lifting-panel.open { right: 0; }

  .panel-close {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-size: 18px;
    width: 32px;
    height: 32px;
    cursor: pointer;
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
  }

  .panel-close:hover { border-color: var(--text); color: var(--text); }

  .panel-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 28px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--lift);
    margin-bottom: 4px;
  }

  .panel-subtitle {
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 24px;
  }

  .exercise-section {
    margin-bottom: 20px;
  }

  .exercise-section h4 {
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }

  .exercise-item {
    display: flex;
    flex-direction: column;
    padding: 10px 0;
    border-bottom: 1px solid #1a1d1a;
    transition: opacity 0.2s;
  }

  .ex-check {
    width: 20px;
    height: 20px;
    border: 1px solid var(--border);
    border-radius: 3px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    color: transparent;
    background: none;
    transition: all 0.2s;
  }

  .exercise-item.done .ex-check {
    background: var(--lift);
    border-color: var(--lift);
    color: var(--bg);
  }

  .ex-info { flex: 1; }

  .ex-name {
    font-size: 13px;
    color: var(--text);
    font-weight: 500;
    transition: color 0.2s;
  }

  .ex-detail {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .superset-label {
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--accent2);
    text-transform: uppercase;
    padding: 6px 0 4px;
  }

  /* SET LOGGING */
  .exercise-item {
    flex-direction: column;
    align-items: stretch;
    cursor: default;
  }

  .exercise-item.done { opacity: 0.55; }

  .ex-header {
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
  }

  .ex-header:hover .ex-name { color: var(--accent); }

  .sets-grid {
    display: none;
    flex-direction: column;
    gap: 6px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }

  .sets-grid.open { display: flex; }

  .set-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .set-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--text-muted);
    text-transform: uppercase;
    min-width: 36px;
  }

  .set-input-group {
    display: flex;
    align-items: center;
    gap: 4px;
    flex: 1;
  }

  .set-input {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 3px;
    color: var(--text);
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 15px;
    width: 54px;
    padding: 5px 8px;
    text-align: center;
    transition: border-color 0.2s;
    -moz-appearance: textfield;
  }

  .set-input::-webkit-outer-spin-button,
  .set-input::-webkit-inner-spin-button { -webkit-appearance: none; }

  .set-input:focus {
    outline: none;
    border-color: var(--accent);
  }

  .set-input.filled { border-color: #3a4a1a; color: var(--accent); }

  .set-input-label {
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 1px;
    text-transform: uppercase;
    width: 26px;
  }

  .set-check {
    width: 24px;
    height: 24px;
    background: none;
    border: 1px solid var(--border);
    border-radius: 3px;
    color: var(--text-dim);
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
  }

  .set-check:hover { border-color: var(--accent); color: var(--accent); }
  .set-check.done { background: var(--accent); border-color: var(--accent); color: var(--bg); }

  .ex-summary {
    font-size: 11px;
    color: var(--accent);
    margin-top: 4px;
    display: none;
    font-family: 'Barlow Condensed', sans-serif;
    letter-spacing: 1px;
  }

  .ex-summary.visible { display: block; }

  /* Prior week reference */
  .prior-week-header {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-dim);
    padding: 8px 0 4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .prior-week-header::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .prior-set-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 3px 0;
    opacity: 0.55;
  }

  .prior-set-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--text-dim);
    text-transform: uppercase;
    min-width: 36px;
  }

  .prior-set-value {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    color: var(--text-muted);
    letter-spacing: 0.5px;
  }

  .prior-set-value.empty {
    font-size: 11px;
    color: var(--text-dim);
    font-style: italic;
    font-family: 'Barlow', sans-serif;
  }

  .sets-divider {
    height: 1px;
    background: var(--border);
    margin: 8px 0;
  }

  .expand-icon {
    font-size: 10px;
    color: var(--text-dim);
    transition: transform 0.2s;
    margin-left: auto;
    padding: 2px 4px;
  }

  .exercise-item.expanded .expand-icon { transform: rotate(180deg); }

  /* Warmup stays simple / clickable */
  .wu-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid #1a1d1a;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .wu-item.done { opacity: 0.4; }
  .wu-item .ex-check { cursor: pointer; }

  /* OVERLAY */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 99;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }

  .overlay.show { opacity: 1; pointer-events: all; }

  /* LIFT TRIGGER BUTTON IN DAY */
  .lift-btn {
    background: none;
    border: 1px solid #2a3a10;
    border-radius: 3px;
    color: var(--lift);
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 4px 8px;
    cursor: pointer;
    transition: all 0.2s;
    align-self: flex-start;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
  }

  .lift-btn:hover {
    background: #2a3a10;
    border-color: var(--lift);
  }

  /* PHASE HIDDEN */
  .phase-section { display: none; }
  .phase-section.active { display: block; }

  /* RESPONSIVE */
  @media (max-width: 768px) {
    header, .legend, .paces-bar, .phase-nav, .main {
      padding-left: 16px;
      padding-right: 16px;
    }
    .days-grid { grid-template-columns: 1fr 1fr; }
    .lifting-panel { width: 100%; right: -100%; }
  }

  /* WEEK PHASE-0 special */
  .phase0-week .week-header { border-left: 3px solid var(--accent3); }
  .race-week-card .week-header { border-left: 3px solid var(--accent); }

  /* Note line */
  .note-line {
    font-size: 10px;
    color: var(--accent3);
    letter-spacing: 0.5px;
    font-style: italic;
  }

  /* Rest day */
  .rest-day { opacity: 0.5; }

  .week-complete-banner {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
    display: none;
  }

  .all-done .week-complete-banner { display: inline; }
</style>
</head>
<body>
<header>
  <div class="title-block">
    <h1>Marathon<br>2026</h1>
    <p>Sept 20 · Race Day</p>
  </div>
  <div class="race-countdown">
    <div class="days" id="countdown">—</div>
    <div class="label">Days to Race</div>
    <a href="fuelingcaculator.html" style="font-family:'Barlow',sans-serif;font-size:11px;color:var(--text-muted);text-decoration:none;letter-spacing:0.08em;align-self:flex-end;">⚡ Fueling</a>
    <a href="caloriecalculator.html" style="font-family:'Barlow',sans-serif;font-size:11px;color:var(--text-muted);text-decoration:none;letter-spacing:0.08em;align-self:flex-end;">🔥 Calories</a>
  </div>
</header>
<div class="legend">
  <div class="legend-item"><div class="legend-dot" style="background:var(--run)"></div> Run</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--lift)"></div> Lift</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--cross)"></div> Cross-Train</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--text-dim)"></div> Rest / Off</div>
  <div class="legend-item" style="margin-left:auto; font-size:11px; color:var(--text-muted);">⚡ = Fuel required · ✓ = Completed</div>
</div>
<div class="paces-bar">
  <div class="pace-tag">Easy <span>7:45–8:30</span></div>
  <div class="pace-tag">Steady <span>7:15–7:30</span></div>
  <div class="pace-tag">Threshold <span>6:10–6:20</span></div>
  <div class="pace-tag">MP <span>6:50–6:55</span></div>
  <div class="pace-tag" style="margin-left:auto;">After every run: <span>Core + Pushups</span></div>
</div>
<div class="phase-nav" id="phaseNav"></div>

<div class="main" id="mainContent"></div>

<div class="overlay" id="overlay" onclick="closePanel()"></div>
<div class="lifting-panel" id="liftingPanel">
  <button class="panel-close" onclick="closePanel()">✕</button>
  <div class="panel-title" id="panelTitle">Lower Body</div>
  <div class="panel-subtitle" id="panelSubtitle">Monday</div>
  <div id="panelContent"></div>
</div>

<script>
// ─── DATA ───────────────────────────────────────────────────────────────────

const LIFTS = {
  lower: {
    title: "Lower Body",
    day: "Monday",
    color: "lift",
    warmup: ["Ankle Mobility", "Knee Hugs", "Quad Pulls", "Figure 4", "Side Lunge", "Floor Taps", "Reverse Lunge", "Banded Walks"],
    sections: [
      { label: "Main Work", exercises: [
        { name: "Split Squat", detail: "3×8" },
        { name: "Single Leg RDL", detail: "3×8" },
        { name: "Glute Ham Raise", detail: "2×8 BW" },
      ]},
      { label: "Superset", superset: true, exercises: [
        { name: "Hip Abduction", detail: "3×12 @ 40 lbs" },
        { name: "Hip Adduction", detail: "3×12 @ 70 lbs" },
      ]},
      { label: "Accessories", exercises: [
        { name: "Standing Calf Raises", detail: "2×10 @ 225 lbs" },
        { name: "Tibia Raises", detail: "2×15" },
      ]},
    ]
  },
  upper: {
    title: "Upper Body",
    day: "Wednesday",
    color: "lift",
    warmup: ["External Rotations", "Arm Circles", "Band Pulls"],

// ─── COUNTDOWN ──────────────────────────────────────────────────────────────

function updateCountdown() {
  const race = new Date('2026-09-20');
  const today = new Date();
  today.setHours(0,0,0,0);
  const diff = Math.ceil((race - today) / 86400000);
  document.getElementById('countdown').textContent = diff > 0 ? diff : '🏁';
}

// ─── RENDER ─────────────────────────────────────────────────────────────────

function getBadges(type) {
  const badges = [];
  if (type.includes('run')) badges.push('<span class="badge run">Run</span>');
  if (type.includes('lift')) badges.push('<span class="badge lift">Lift</span>');
  if (type.includes('cross')) badges.push('<span class="badge cross">Cross</span>');
  if (type === 'rest') badges.push('<span class="badge rest">Rest</span>');
  if (type === 'race') badges.push('<span class="badge race">Race Day</span>');
  return badges.join('');
}

function getWorkoutColor(workout) {
  if (workout.includes('MP') || workout.includes('Marathon Pace')) return 'highlight';
  if (workout.includes('Threshold') || workout.includes('Tempo')) return 'run-color';
  if (workout.includes('Z2') || workout.includes('Bike') || workout.includes('ERG')) return 'cross-color';
  if (workout.includes('🏁')) return 'highlight';
  return '';
}

function renderDay(week, dayIdx, day) {
  const key = `${week.id}_d${dayIdx}`;
  const done = completedDays[key];
  const isRestDay = day.type === 'rest';
  const hasLift = day.lift;

  let liftBtn = '';
  if (hasLift) {
    liftBtn = `<button class="lift-btn" onclick="openPanel('${day.lift}', '${week.id}', ${dayIdx})" >View Lift ↗</button>`;
  }

  const workoutLines = day.workouts.map(w => {
    const cls = getWorkoutColor(w);
    return `<div class="workout-line ${cls}">${w}</div>`;
  }).join('');

  const noteLine = day.note ? `<div class="workout-line note-line">${day.note}</div>` : '';

  return `
    <div class="day-card ${done ? 'completed' : ''} ${isRestDay ? 'rest-day' : ''}" id="${key}">
      <div class="day-top">
        <div>
          <div class="day-name">${day.name}</div>
          <div class="day-date">${dayDate(week.start, dayIdx)}</div>
        </div>
        <div class="day-type-badge">${getBadges(day.type)}</div>
      </div>
      <div class="workout-lines">
        ${workoutLines}
        ${noteLine}
      </div>
      ${liftBtn}
      ${!isRestDay ? `<button class="check-btn" onclick="toggleDay('${key}')" title="${done ? 'Mark incomplete' : 'Mark complete'}">${done ? '✓' : ''}</button>` : ''}
    </div>`;
}

function getWeekProgress(week) {
  const total = week.days.filter(d => d.type !== 'rest').length;
  const done = week.days.filter((d, i) => {
    const key = `${week.id}_d${i}`;
    return d.type !== 'rest' && completedDays[key];
  }).length;
  return { done, total, pct: total ? Math.round((done/total)*100) : 0 };
}

function renderWeek(week) {
  const prog = getWeekProgress(week);
  const isOpen = openWeeks[week.id];
  const tagHtml = week.tag ? `<span class="week-tag ${week.tag}">${week.tagLabel}</span>` : '';
  const weekClass = week.tag === 'race' ? 'race-week-card' : week.tag === 'phase0' ? 'phase0-week' : '';

  return `
    <div class="week ${week.tag === 'down' || week.tag === 'race' ? week.tag + '-week' : ''} ${weekClass} ${isOpen ? 'open' : ''}" id="week_${week.id}">
      <div class="week-header" onclick="toggleWeek('${week.id}')">
        <div class="week-label">
          <div class="week-num">${week.num}</div>
          <div>
            <div class="week-dates">${week.dates}</div>
            <div style="font-size:11px;color:var(--text-muted);margin-top:2px;">${week.label}</div>
          </div>
          ${tagHtml}
          <span class="week-complete-banner">✓ Complete</span>
        </div>
        <div style="display:flex;align-items:center;gap:16px;">
          <div class="week-mileage">${week.mileage}</div>
          <div class="week-progress">
            <div class="progress-bar"><div class="progress-fill" style="width:${prog.pct}%"></div></div>
            <div class="progress-text">${prog.done}/${prog.total}</div>
          </div>
          <div class="chevron">▼</div>
        </div>
      </div>
      <div class="days-grid">
        ${week.days.map((d, i) => renderDay(week, i, d)).join('')}
      </div>
    </div>`;
}

function renderPhaseNav() {
  const nav = document.getElementById('phaseNav');
  nav.innerHTML = PHASES.map(p => `
    <button class="phase-btn ${p.id === activePhase ? 'active' : ''}" onclick="setPhase('${p.id}')">${p.label}</button>
  `).join('');
}

function renderMain() {
  const main = document.getElementById('mainContent');
  const phase = PHASES.find(p => p.id === activePhase);

  const weeks = WEEKS.filter(w => phase.weeks.includes(w.id));

  main.innerHTML = `
    <div class="phase-header">
      <h2>${phase.label}</h2>
      <p>${phase.title}</p>
    </div>
    ${weeks.map(renderWeek).join('')}
  `;

  // Update all-done banners
  WEEKS.forEach(w => {
    const prog = getWeekProgress(w);
    const el = document.getElementById(`week_${w.id}`);
    if (el && prog.total > 0 && prog.done === prog.total) {
      el.classList.add('all-done');
    }
  });
}

function setPhase(id) {
  activePhase = id;
  saveState();
  renderPhaseNav();
  renderMain();
}

function toggleWeek(id) {
  openWeeks[id] = !openWeeks[id];
  saveState();
  const el = document.getElementById(`week_${id}`);
  if (el) el.classList.toggle('open', openWeeks[id]);
}

function toggleDay(key) {
  completedDays[key] = !completedDays[key];
  saveState();
  const card = document.getElementById(key);
  if (card) {
    card.classList.toggle('completed', completedDays[key]);
    const btn = card.querySelector('.check-btn');
    if (btn) btn.textContent = completedDays[key] ? '✓' : '';
  }
  // Update progress bar
  const weekId = key.split('_d')[0];
  const week = WEEKS.find(w => w.id === weekId);
  if (week) {
    const prog = getWeekProgress(week);
    const weekEl = document.getElementById(`week_${weekId}`);
    if (weekEl) {
      const fill = weekEl.querySelector('.progress-fill');
      const text = weekEl.querySelector('.progress-text');
      if (fill) fill.style.width = prog.pct + '%';
      if (text) text.textContent = `${prog.done}/${prog.total}`;
      if (prog.total > 0 && prog.done === prog.total) weekEl.classList.add('all-done');
      else weekEl.classList.remove('all-done');
    }
  }
}

// ─── PRIOR WEEK LOOKUP ───────────────────────────────────────────────────────

// Build a map: for each (liftType, sectionIdx, exerciseIdx) → ordered list of [weekId, dayIdx]
// So when opening a panel we can find which week came just before.

// For a given weekId + dayIdx + liftId + si + ei, find the prior week's exKey
function getPriorExKey(weekId, dayIdx, liftId, si, ei) {
  const weekIdx = WEEKS.findIndex(w => w.id === weekId);
  if (weekIdx <= 0) return null;

  // Walk backwards through weeks to find the most recent one with the same liftId on same dayIdx slot
  // "same slot" = same dayIdx position AND same liftId (or a variant containing the same exercises)
  // We match on liftId family: lower/lower_reduced share exercises, upper/upper_reduced share, power/power_reduced/plyo_only share
  const family = liftFamily(liftId);

  for (let w = weekIdx - 1; w >= 0; w--) {
    const priorWeek = WEEKS[w];
    const priorDay = priorWeek.days[dayIdx];
    if (!priorDay || !priorDay.lift) continue;
    if (liftFamily(priorDay.lift) !== family) continue;

    // Found a prior week with the same lift family on same day slot
    const priorLiftId = priorDay.lift;
    const priorLift = LIFTS[priorLiftId];
    if (!priorLift) continue;

    // Check section si and exercise ei exist in prior lift
    if (!priorLift.sections[si] || !priorLift.sections[si].exercises[ei]) continue;

    return `${priorWeek.id}_d${dayIdx}_${priorLiftId}_s${si}e${ei}`;
  }
  return null;
}

function liftFamily(liftId) {
  if (liftId.startsWith('lower')) return 'lower';
  if (liftId.startsWith('upper')) return 'upper';
  if (liftId.startsWith('power') || liftId.startsWith('plyo')) return 'power';
  return liftId;
}

function buildPriorSummary(priorExKey, numSets) {
  // Collect all sets (done or not — they logged them)
  const sets = [];
  for (let s = 0; s < numSets; s++) {
    const log = setLogs[`${priorExKey}_set${s}`];
    if (log && (log.weight || log.reps)) sets.push(log);
  }
  return sets;
}

function renderPriorRows(priorExKey, numSets, bw) {
  const sets = buildPriorSummary(priorExKey, numSets);
  if (!sets.length) return `
    <div class="prior-week-header">Last Week</div>
    <div class="prior-set-row"><div class="prior-set-value empty">No data logged</div></div>
  `;

  let rows = `<div class="prior-week-header">Last Week</div>`;
  sets.forEach((log, i) => {
    let val = '';
    if (log.weight && log.reps) val = `${log.weight} lbs × ${log.reps} reps`;
    else if (log.reps) val = `${log.reps} reps`;
    else if (log.weight) val = `${log.weight} lbs`;
    rows += `
      <div class="prior-set-row">
        <div class="prior-set-label">Set ${i+1}</div>
        <div class="prior-set-value">${val}</div>
      </div>`;
  });
  return rows;
}

// ─── LIFTING PANEL ───────────────────────────────────────────────────────────

let currentPanelKey = null;
// setLogs: { [exKey_set_N]: { weight, reps, done } }
let setLogs = JSON.parse(localStorage.getItem('set_logs') || '{}');

function saveSetLogs() {
  localStorage.setItem('set_logs', JSON.stringify(setLogs));
}

// Parse set count from detail string e.g. "3×8", "2×15 BW", "4×3"
function parseSets(detail) {
  const m = detail.match(/^(\d+)[×x]/);
  return m ? parseInt(m[1]) : 3;
}

// Does exercise have bodyweight (no weight input)?
function isBW(detail) {
  return /bw|bodyweight|pull.up/i.test(detail);
}

// Does exercise track reps vs time?
function isTime(detail) {
  return /min|sec/i.test(detail);
}

function buildSetSummary(exKey, numSets) {
  const done = [];
  for (let s = 0; s < numSets; s++) {
    const log = setLogs[`${exKey}_set${s}`];
    if (log && log.done) done.push(log);
  }
  if (!done.length) return '';
  const parts = done.map(l => {
    if (l.weight && l.reps) return `${l.weight}×${l.reps}`;
    if (l.reps) return `${l.reps} reps`;
    if (l.weight) return `${l.weight} lbs`;
    return '✓';
  });
  return parts.join(' · ');
}

function renderSetRows(exKey, numSets, bw, priorExKey) {
  let rows = '';
  for (let s = 0; s < numSets; s++) {
    const sKey = `${exKey}_set${s}`;
    const log = setLogs[sKey] || {};
    const done = log.done || false;
    rows += `
      <div class="set-row" id="row_${sKey}">
        <div class="set-label">Set ${s+1}</div>
        <div class="set-input-group">
          ${!bw ? `<input class="set-input ${log.weight ? 'filled' : ''}" type="number" placeholder="lbs"
            value="${log.weight || ''}"
            oninput="logSet('${sKey}','weight',this.value)"
            onclick="event.stopPropagation()"
            inputmode="decimal">
          <span class="set-input-label">lbs</span>` : ''}
          <input class="set-input ${log.reps ? 'filled' : ''}" type="number" placeholder="reps"
            value="${log.reps || ''}"
            oninput="logSet('${sKey}','reps',this.value)"
            onclick="event.stopPropagation()"
            inputmode="decimal">
          <span class="set-input-label">reps</span>
        </div>
        <button class="set-check ${done ? 'done' : ''}" onclick="toggleSetDone('${sKey}','${exKey}',${numSets})">${done ? '✓' : ''}</button>
      </div>`;
  }
  // Prior week section
  if (priorExKey) {
    rows += `<div class="sets-divider"></div>`;
    rows += renderPriorRows(priorExKey, numSets, bw);
  }
  return rows;
}

function openPanel(liftId, weekId, dayIdx) {
  const lift = LIFTS[liftId];
  if (!lift) return;
  currentPanelKey = `${weekId}_d${dayIdx}_${liftId}`;

  document.getElementById('panelTitle').textContent = lift.title;
  document.getElementById('panelSubtitle').textContent = lift.day;

  let html = '';

  // Warmup — stays simple tap-to-check
  html += `<div class="exercise-section">
    <h4>Warmup</h4>
    ${lift.warmup.map((ex, i) => {
      const exKey = `${currentPanelKey}_wu${i}`;
      const done = completedExercises[exKey];
      return `<div class="wu-item ${done ? 'done' : ''}" id="wu_${exKey}" onclick="toggleWu('${exKey}')">
        <div class="ex-check" style="${done ? 'background:var(--lift);border-color:var(--lift);color:var(--bg)' : ''}">${done ? '✓' : ''}</div>
        <div class="ex-info"><div class="ex-name">${ex}</div></div>
      </div>`;
    }).join('')}
  </div>`;

  // Sections with set logging + prior week
  lift.sections.forEach((section, si) => {
    html += `<div class="exercise-section">
      <h4>${section.label}</h4>
      ${section.superset ? '<div class="superset-label">↕ Superset</div>' : ''}
      ${section.exercises.map((ex, ei) => {
        const exKey = `${currentPanelKey}_s${si}e${ei}`;
        const numSets = parseSets(ex.detail);
        const bw = isBW(ex.detail);
        const allDone = Array.from({length:numSets},(_,s)=>setLogs[`${exKey}_set${s}`]?.done).every(Boolean);
        const summary = buildSetSummary(exKey, numSets);
        const priorExKey = getPriorExKey(weekId, dayIdx, liftId, si, ei);
        return `
        <div class="exercise-item ${allDone ? 'done' : ''}" id="ex_${exKey}">
          <div class="ex-header" onclick="toggleExExpand('${exKey}', ${numSets})">
            <div class="ex-check" id="excheck_${exKey}" style="${allDone ? 'background:var(--lift);border-color:var(--lift);color:var(--bg)' : ''}">${allDone ? '✓' : ''}</div>
            <div class="ex-info">
              <div class="ex-name">${ex.name}</div>
              <div class="ex-detail">${ex.detail}</div>
              <div class="ex-summary ${summary ? 'visible' : ''}" id="summary_${exKey}">${summary}</div>
            </div>
            <span class="expand-icon">▼</span>
          </div>
          <div class="sets-grid" id="sets_${exKey}">
            ${renderSetRows(exKey, numSets, bw, priorExKey)}
          </div>
        </div>`;
      }).join('')}
    </div>`;
  });

  document.getElementById('panelContent').innerHTML = html;
  document.getElementById('liftingPanel').classList.add('open');
  document.getElementById('overlay').classList.add('show');
}

function closePanel() {
  document.getElementById('liftingPanel').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}

function toggleWu(key) {
  completedExercises[key] = !completedExercises[key];
  saveState();
  const el = document.getElementById(`wu_${key}`);
  if (!el) return;
  el.classList.toggle('done', completedExercises[key]);
  const chk = el.querySelector('.ex-check');
  chk.textContent = completedExercises[key] ? '✓' : '';
  chk.style = completedExercises[key] ? 'background:var(--lift);border-color:var(--lift);color:var(--bg)' : '';
}

function toggleExExpand(exKey, numSets) {
  const setsEl = document.getElementById(`sets_${exKey}`);
  const exEl = document.getElementById(`ex_${exKey}`);
  if (!setsEl) return;
  const isOpen = setsEl.classList.toggle('open');
  exEl.classList.toggle('expanded', isOpen);
}

function logSet(sKey, field, value) {
  if (!setLogs[sKey]) setLogs[sKey] = {};
  setLogs[sKey][field] = value;
  saveSetLogs();
  // Mark input as filled
  const inp = document.querySelector(`#row_${sKey} input[oninput*="${field}"]`);
  if (inp) inp.classList.toggle('filled', !!value);
}

function toggleSetDone(sKey, exKey, numSets) {
  if (!setLogs[sKey]) setLogs[sKey] = {};
  setLogs[sKey].done = !setLogs[sKey].done;
  saveSetLogs();

  const btn = document.querySelector(`#row_${sKey} .set-check`);
  if (btn) {
    btn.classList.toggle('done', setLogs[sKey].done);
    btn.textContent = setLogs[sKey].done ? '✓' : '';
  }

  // Update summary & all-done state
  const summary = buildSetSummary(exKey, numSets);
  const summaryEl = document.getElementById(`summary_${exKey}`);
  if (summaryEl) {
    summaryEl.textContent = summary;
    summaryEl.classList.toggle('visible', !!summary);
  }

  const allDone = Array.from({length:numSets},(_,s)=>setLogs[`${exKey}_set${s}`]?.done).every(Boolean);
  const exEl = document.getElementById(`ex_${exKey}`);
  const chkEl = document.getElementById(`excheck_${exKey}`);
  if (exEl) exEl.classList.toggle('done', allDone);
  if (chkEl) {
    chkEl.textContent = allDone ? '✓' : '';
    chkEl.style = allDone ? 'background:var(--lift);border-color:var(--lift);color:var(--bg)' : '';
  }
}

// ─── INIT ────────────────────────────────────────────────────────────────────

updateCountdown();
renderPhaseNav();
renderMain();
</script>

</html>
