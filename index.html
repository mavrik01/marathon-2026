<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maverik — Marathon 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f0e;
    --surface: #141714;
    --surface2: #1a1d1a;
    --border: #2a2e2a;
    --accent: #b8f55a;
    --accent2: #5af5b8;
    --accent3: #f5a85a;
    --accent4: #5ab8f5;
    --text: #e8ede8;
    --text-muted: #6b756b;
    --text-dim: #3d443d;
    --run: #5af5b8;
    --cross: #5ab8f5;
    --rest: #3d443d;
    --done: #2a332a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* HEADER */
  header {
    padding: 32px 40px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
    flex-wrap: wrap;
  }

  .title-block h1 {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: clamp(36px, 6vw, 72px);
    line-height: 0.9;
    letter-spacing: -1px;
    color: var(--accent);
    text-transform: uppercase;
  }

  .title-block p {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 400;
    font-size: 14px;
    letter-spacing: 4px;
    color: var(--text-muted);
    text-transform: uppercase;
    margin-top: 8px;
  }

  .race-countdown {
    text-align: right;
  }

  .race-countdown .days {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: clamp(48px, 8vw, 96px);
    line-height: 1;
    color: var(--text);
  }

  .race-countdown .label {
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--text-muted);
    text-transform: uppercase;
  }

  /* LEGEND */
  .legend {
    display: flex;
    gap: 20px;
    padding: 16px 40px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
    align-items: center;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .legend-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }

  /* PACES */
  .paces-bar {
    display: flex;
    gap: 0;
    padding: 12px 40px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
    gap: 24px;
  }

  .pace-tag {
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 1px;
  }

  .pace-tag span {
    color: var(--text);
    font-weight: 500;
  }

  /* PHASE NAVIGATION */
  .phase-nav {
    display: flex;
    gap: 0;
    padding: 0 40px;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }

  .phase-btn {
    background: none;
    border: none;
    border-bottom: 3px solid transparent;
    color: var(--text-muted);
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    padding: 16px 20px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
  }

  .phase-btn:hover { color: var(--text); }
  .phase-btn.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  /* MAIN CONTENT */
  .main {
    padding: 32px 40px;
    max-width: 1400px;
  }

  /* PHASE HEADER */
  .phase-header {
    display: flex;
    align-items: baseline;
    gap: 16px;
    margin-bottom: 24px;
  }

  .phase-header h2 {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 32px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--accent);
  }

  .phase-header p {
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* WEEK */
  .week {
    margin-bottom: 20px;
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
    transition: all 0.3s;
  }

  .week.down-week { border-color: #2a3d2a; }
  .week.race-week { border-color: var(--accent); }

  .week-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    background: var(--surface);
    cursor: pointer;
    gap: 12px;
    flex-wrap: wrap;
  }

  .week-header:hover { background: var(--surface2); }

  .week-label {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .week-num {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 20px;
    color: var(--accent);
    min-width: 60px;
  }

  .week-dates {
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 1px;
  }

  .week-tag {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 2px;
    background: #1f2e1f;
    color: var(--accent2);
  }

  .week-tag.down { background: #1f2a1f; color: #5af5b8; }
  .week-tag.race { background: var(--accent); color: var(--bg); }
  .week-tag.phase0 { background: #2a2a1f; color: var(--accent3); }

  .week-mileage {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 18px;
    color: var(--text-muted);
  }

  .week-progress {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .progress-bar {
    width: 80px;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.3s;
  }

  .progress-text {
    font-size: 11px;
    color: var(--text-muted);
    min-width: 32px;
    text-align: right;
  }

  .chevron {
    color: var(--text-dim);
    font-size: 14px;
    transition: transform 0.3s;
  }

  .week.open .chevron { transform: rotate(180deg); }

  /* DAYS GRID */
  .days-grid {
    display: none;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 1px;
    background: var(--border);
  }

  .week.open .days-grid { display: grid; }

  .day-card {
    background: var(--bg);
    padding: 16px;
    min-height: 120px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .day-card.completed { background: var(--done); }

  .day-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .day-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .day-date {
    font-size: 10px;
    color: var(--text-dim);
  }

  .day-type-badge {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
  }

  .badge {
    font-size: 9px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 2px 6px;
    border-radius: 2px;
    font-weight: 600;
  }

  .badge.run { background: #0d2d20; color: var(--run); }
  .badge.cross { background: #0a1e30; color: var(--cross); }
  .badge.rest { background: #1a1a1a; color: var(--text-dim); }
  .badge.race { background: var(--accent); color: var(--bg); }

  .workout-lines {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .workout-line {
    font-size: 12px;
    color: var(--text);
    line-height: 1.4;
  }

  .workout-line.muted { color: var(--text-muted); font-size: 11px; }
  .workout-line.highlight { color: var(--accent); font-weight: 500; }
  .workout-line.run-color { color: var(--run); }
  .workout-line.cross-color { color: var(--cross); }

  .check-btn {
    align-self: flex-end;
    background: none;
    border: 1px solid var(--border);
    border-radius: 3px;
    width: 28px;
    height: 28px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    font-size: 14px;
    transition: all 0.2s;
    margin-top: 4px;
    flex-shrink: 0;
  }

  .check-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .day-card.completed .check-btn {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--bg);
  }

  /* PHASE HIDDEN */
  .phase-section { display: none; }
  .phase-section.active { display: block; }

  /* RESPONSIVE */
  @media (max-width: 768px) {
    header, .legend, .paces-bar, .phase-nav, .main {
      padding-left: 16px;
      padding-right: 16px;
    }
    .days-grid { grid-template-columns: 1fr 1fr; }
  }

  /* WEEK PHASE-0 special */
  .phase0-week .week-header { border-left: 3px solid var(--accent3); }
  .race-week-card .week-header { border-left: 3px solid var(--accent); }

  /* Note line */
  .note-line {
    font-size: 10px;
    color: var(--accent3);
    letter-spacing: 0.5px;
    font-style: italic;
  }

  /* Rest day */
  .rest-day { opacity: 0.5; }

  .week-complete-banner {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
    display: none;
  }

  .all-done .week-complete-banner { display: inline; }
</style>

    id: "w13", num: "Week 13", label: "Taper Start", dates: "Sep 7–13", mileage: "42–45 mi", tag: "down", tagLabel: "↓ Taper",
    start: "2026-09-07",
    days: [
      { name: "Mon", type: "run", workouts: ["7 mi Easy"] },
      { name: "Tue", type: "run", workouts: ["8 mi w/ 4 @MP"] },
      { name: "Wed", type: "run", workouts: ["7 mi Easy"] },
      { name: "Thu", type: "run", workouts: ["10 mi Steady"] },
      { name: "Fri", type: "cross", workouts: ["60 min Z2 ERG"] },
      { name: "Sat", type: "run", workouts: ["12 mi relaxed ⚡"] },
      { name: "Sun", type: "rest", workouts: ["Off"] },
    ]
  },
  {
    id: "w14", num: "Race Week", label: "🏁 Marathon", dates: "Sep 14–20", mileage: "~26 mi", tag: "race", tagLabel: "Race Week",
    start: "2026-09-14",
    days: [
      { name: "Mon", type: "run", workouts: ["6 mi Easy"] },
      { name: "Tue", type: "run", workouts: ["6 mi w/ 2×2 mi @MP"] },
      { name: "Wed", type: "run", workouts: ["5 mi Easy"] },
      { name: "Thu", type: "run", workouts: ["4 mi Easy"] },
      { name: "Fri", type: "rest", workouts: ["Off — Rest"] },
      { name: "Sat", type: "run", workouts: ["3 mi Easy + strides"] },
      { name: "Sun", type: "race", workouts: ["🏁 MARATHON", "Sept 20, 2026"] },
    ]
  },
];

// ─── STATE ──────────────────────────────────────────────────────────────────

let completedDays = JSON.parse(localStorage.getItem('completed_days') || '{}');
let openWeeks = JSON.parse(localStorage.getItem('open_weeks') || '{}');
let activePhase = localStorage.getItem('active_phase') || 'p0';

function saveState() {
  localStorage.setItem('completed_days', JSON.stringify(completedDays));
  localStorage.setItem('open_weeks', JSON.stringify(openWeeks));
  localStorage.setItem('active_phase', activePhase);
}

// ─── COUNTDOWN ──────────────────────────────────────────────────────────────

function updateCountdown() {
  const race = new Date('2026-09-20');
  const today = new Date();
  today.setHours(0,0,0,0);
  const diff = Math.ceil((race - today) / 86400000);
  document.getElementById('countdown').textContent = diff > 0 ? diff : '🏁';
}

// ─── RENDER ─────────────────────────────────────────────────────────────────

function getBadges(type) {
  const badges = [];
  if (type.includes('run')) badges.push('<span class="badge run">Run</span>');
  if (type.includes('cross')) badges.push('<span class="badge cross">Cross</span>');
  if (type === 'rest') badges.push('<span class="badge rest">Rest</span>');
  if (type === 'race') badges.push('<span class="badge race">Race Day</span>');
  return badges.join('');
}

function getWorkoutColor(workout) {
  if (workout.includes('MP') || workout.includes('Marathon Pace')) return 'highlight';
  if (workout.includes('Threshold') || workout.includes('Tempo')) return 'run-color';
  if (workout.includes('Z2') || workout.includes('Bike') || workout.includes('ERG')) return 'cross-color';
  if (workout.includes('🏁')) return 'highlight';
  return '';
}

function renderDay(week, dayIdx, day) {
  const key = `${week.id}_d${dayIdx}`;
  const done = completedDays[key];
  const isRestDay = day.type === 'rest';

  const workoutLines = day.workouts.map(w => {
    const cls = getWorkoutColor(w);
    return `<div class="workout-line ${cls}">${w}</div>`;
  }).join('');

  const noteLine = day.note ? `<div class="workout-line note-line">${day.note}</div>` : '';

  return `
    <div class="day-card ${done ? 'completed' : ''} ${isRestDay ? 'rest-day' : ''}" id="${key}">
      <div class="day-top">
        <div>
          <div class="day-name">${day.name}</div>
          <div class="day-date">${dayDate(week.start, dayIdx)}</div>
        </div>
        <div class="day-type-badge">${getBadges(day.type)}</div>
      </div>
      <div class="workout-lines">
        ${workoutLines}
        ${noteLine}
      </div>
      ${!isRestDay ? `<button class="check-btn" onclick="toggleDay('${key}')" title="${done ? 'Mark incomplete' : 'Mark complete'}">${done ? '✓' : ''}</button>` : ''}
    </div>`;
}

function getWeekProgress(week) {
  const total = week.days.filter(d => d.type !== 'rest').length;
  const done = week.days.filter((d, i) => {
    const key = `${week.id}_d${i}`;
    return d.type !== 'rest' && completedDays[key];
  }).length;
  return { done, total, pct: total ? Math.round((done/total)*100) : 0 };
}

function renderWeek(week) {
  const prog = getWeekProgress(week);
  const isOpen = openWeeks[week.id];
  const tagHtml = week.tag ? `<span class="week-tag ${week.tag}">${week.tagLabel}</span>` : '';
  const weekClass = week.tag === 'race' ? 'race-week-card' : week.tag === 'phase0' ? 'phase0-week' : '';

  return `
    <div class="week ${week.tag === 'down' || week.tag === 'race' ? week.tag + '-week' : ''} ${weekClass} ${isOpen ? 'open' : ''}" id="week_${week.id}">
      <div class="week-header" onclick="toggleWeek('${week.id}')">
        <div class="week-label">
          <div class="week-num">${week.num}</div>
          <div>
            <div class="week-dates">${week.dates}</div>
            <div style="font-size:11px;color:var(--text-muted);margin-top:2px;">${week.label}</div>
          </div>
          ${tagHtml}
          <span class="week-complete-banner">✓ Complete</span>
        </div>
        <div style="display:flex;align-items:center;gap:16px;">
          <div class="week-mileage">${week.mileage}</div>
          <div class="week-progress">
            <div class="progress-bar"><div class="progress-fill" style="width:${prog.pct}%"></div></div>
            <div class="progress-text">${prog.done}/${prog.total}</div>
          </div>
          <div class="chevron">▼</div>
        </div>
      </div>
      <div class="days-grid">
        ${week.days.map((d, i) => renderDay(week, i, d)).join('')}
      </div>
    </div>`;
}

function renderPhaseNav() {
  const nav = document.getElementById('phaseNav');
  nav.innerHTML = PHASES.map(p => `
    <button class="phase-btn ${p.id === activePhase ? 'active' : ''}" onclick="setPhase('${p.id}')">${p.label}</button>
  `).join('');
}

function renderMain() {
  const main = document.getElementById('mainContent');
  const phase = PHASES.find(p => p.id === activePhase);

  const weeks = WEEKS.filter(w => phase.weeks.includes(w.id));

  main.innerHTML = `
    <div class="phase-header">
      <h2>${phase.label}</h2>
      <p>${phase.title}</p>
    </div>
    ${weeks.map(renderWeek).join('')}
  `;

  // Update all-done banners
  WEEKS.forEach(w => {
    const prog = getWeekProgress(w);
    const el = document.getElementById(`week_${w.id}`);
    if (el && prog.total > 0 && prog.done === prog.total) {
      el.classList.add('all-done');
    }
  });
}

// ─── INTERACTIONS ────────────────────────────────────────────────────────────

function setPhase(id) {
  activePhase = id;
  saveState();
  renderPhaseNav();
  renderMain();
}

function toggleWeek(id) {
  openWeeks[id] = !openWeeks[id];
  saveState();
  const el = document.getElementById(`week_${id}`);
  if (el) el.classList.toggle('open', openWeeks[id]);
}

function toggleDay(key) {
  completedDays[key] = !completedDays[key];
  saveState();
  const card = document.getElementById(key);
  if (card) {
    card.classList.toggle('completed', completedDays[key]);
    const btn = card.querySelector('.check-btn');
    if (btn) btn.textContent = completedDays[key] ? '✓' : '';
  }
  // Update progress bar
  const weekId = key.split('_d')[0];
  const week = WEEKS.find(w => w.id === weekId);
  if (week) {
    const prog = getWeekProgress(week);
    const weekEl = document.getElementById(`week_${weekId}`);
    if (weekEl) {
      const fill = weekEl.querySelector('.progress-fill');
      const text = weekEl.querySelector('.progress-text');
      if (fill) fill.style.width = prog.pct + '%';
      if (text) text.textContent = `${prog.done}/${prog.total}`;
      if (prog.total > 0 && prog.done === prog.total) weekEl.classList.add('all-done');
      else weekEl.classList.remove('all-done');
    }
  }
}

// ─── INIT ────────────────────────────────────────────────────────────────────

updateCountdown();
renderPhaseNav();
renderMain();
</script>
</body>
</html>
